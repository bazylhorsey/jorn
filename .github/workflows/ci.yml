name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  elm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save elm@0.19.1-6 elm-test@0.19.1-revision15 elm-format@0.8.8
      - run: npx elm-format --validate src tests examples client/test/elm/src
      - run: npx elm make --docs=docs.json
      - run: npx elm-test --fuzz 1000

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save elm@0.19.1-6
      - run: $GITHUB_WORKSPACE/node_modules/.bin/elm make src/ClientSpec.elm --optimize --output=build/spec.js
        working-directory: client/test/elm
      - run: npm ci
        working-directory: client/test
      - name: Browser patcher, unit and randomized tests
        run: node run.mjs 5000
        working-directory: client/test
      - run: $GITHUB_WORKSPACE/node_modules/.bin/elm make src/RuntimeSpec.elm --output=build/runtime.js
        working-directory: client/test/elm
      - name: App runtime
        run: node runtime.mjs
        working-directory: client/test
      - run: $GITHUB_WORKSPACE/node_modules/.bin/elm make src/Main.elm --output=build/main.js
        working-directory: examples/todos
      - name: Todos example
        run: node example.mjs
        working-directory: client/test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save elm@0.19.1-6
      - run: $GITHUB_WORKSPACE/node_modules/.bin/elm make src/RuntimeSpec.elm --output=build/runtime.js
        working-directory: client/test/elm
      - run: $GITHUB_WORKSPACE/node_modules/.bin/elm make src/Main.elm --output=build/main.js
        working-directory: examples/todos
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: server/test
      - run: npm ci
        working-directory: client/test
      - name: Server runtime
        run: node run.mjs
        working-directory: server/test
      - name: Reconnects, heartbeats and limits
        run: node reconnect.mjs
        working-directory: server/test
      - name: Todos example on a server
        run: node example.mjs server
        working-directory: client/test

  elm-0-19-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save elm@0.19.2-0
      - run: npx elm make --docs=docs.json

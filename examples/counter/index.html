<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jorn counter</title>
    <style>
      body { font: 18px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 28rem; padding: 0 1rem; }
      input { font: inherit; padding: 0.3rem 0.5rem; display: block; margin-bottom: 1rem; }
      button { font: inherit; width: 2.5rem; }
      span { display: inline-block; min-width: 3rem; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- The same Elm program the Node demo runs, now running in this page. -->
    <script src="build/main.js"></script>
    <script type="module">
      import { connect } from "../../client/jorn.js";

      const app = Elm.Main.init();

      // Client mode: Elm runs right here, so hand it the live event.
      const jorn = connect(document.getElementById("app"), {
        send: (event) => app.ports.fromClient.send(event),
        raw: true,
      });

      app.ports.toClient.subscribe((message) => {
        if (message.mount) jorn.mount(message.mount);
        else if (message.patches) jorn.patch(message.patches);
        else if (message.error) console.warn(message.error);
      });
    </script>
  </body>
</html>
